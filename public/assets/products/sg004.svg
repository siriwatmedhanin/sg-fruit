    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6da338"/>
      <stop offset="55%" stop-color="#3e7526"/>
      <stop offset="100%" stop-color="#244d17"/>

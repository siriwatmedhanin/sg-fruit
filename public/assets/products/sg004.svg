<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="65%" stop-color="#f7f3e6"/>
      <stop offset="100%" stop-color="#ebe3ce"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b3a28" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#2b3a28" stop-opacity="0.10"/>

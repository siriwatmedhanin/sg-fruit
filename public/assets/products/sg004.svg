  <circle cx="220" cy="260" r="46" fill="url(#longanShell)"/>
  <circle cx="295" cy="245" r="48" fill="url(#longanShell)"/>
  <circle cx="370" cy="265" r="45" fill="url(#longanShell)"/>
  <circle cx="185" cy="335" r="47" fill="url(#longanShell)"/>
  <circle cx="260" cy="325" r="50" fill="url(#longanShell)"/>
  <circle cx="340" cy="330" r="49" fill="url(#longanShell)"/>
  <circle cx="415" cy="340" r="46" fill="url(#longanShell)"/>
  <circle cx="225" cy="395" r="48" fill="url(#longanShell)"/>
  <circle cx="305" cy="400" r="51" fill="url(#longanShell)"/>
  <!-- Peeled Longan Front Right -->
  <g transform="translate(392, 405)">
    <path d="M -52,10 A 52,52 0 1,0 52,10 Z" fill="url(#longanShell)"/>
    <circle cx="0" cy="-4" r="42" fill="url(#longanFlesh)"/>

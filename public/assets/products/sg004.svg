      <stop offset="60%" stop-color="#eef2ee"/>
      <stop offset="100%" stop-color="#cad4cc"/>
    </radialGradient>
  </defs>
  <ellipse cx="300" cy="468" rx="190" ry="32" fill="url(#floorShadow)"/>
  <!-- Leaves and stem -->
  <path d="M 140,175 C 240,195 350,185 455,155" stroke="#6e4b26" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 170,180 C 110,130 85,175 120,225 C 155,230 175,205 170,180 Z" fill="url(#leafGrad)"/>
  <path d="M 410,165 C 465,120 505,160 470,215 C 435,220 410,190 410,165 Z" fill="url(#leafGrad)"/>
